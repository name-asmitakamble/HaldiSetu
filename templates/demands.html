{% extends "base.html" %}
{% block title %}Buyer demands{% endblock %}
{% block content %}
<div class="row-actions" style="justify-content:space-between"><h1>Buyer demands</h1>
  {% if user and user.role == 'buyer' %}<a class="btn" href="{{ url_for('mp.demand_new') }}">+ Post a demand</a>{% endif %}</div>
<form method="get" class="card form-grid">
  <div><label for="industry">Industry</label><select id="industry" name="industry"><option value="">All</option>
    {% for i in industries %}<option {{ 'selected' if f.get('industry') == i }}>{{ i }}</option>{% endfor %}</select></div>
  <div class="full"><button class="btn" type="submit">Filter</button></div>
</form>
<div class="grid cols-2" style="margin-top:16px">
  {% for d in rows %}{% include "_demand_card.html" %}{% else %}<p class="muted">No open demands.</p>{% endfor %}
</div>
{% endblock %}
