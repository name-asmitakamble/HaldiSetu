{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h1>Users</h1>
<div class="table-wrap"><table><tr><th>#</th><th>Name</th><th>Role</th><th>Mobile</th><th>District</th><th>Verification</th></tr>
  {% for u, st in rows %}<tr><td>{{ u.user_id }}</td><td>{{ u.name }}</td><td>{{ u.role }}</td><td>{{ u.phone }}</td><td>{{ u.district or '—' }}</td>
    <td><span class="badge {{ 'ok' if st == 'approved' else 'warn' }}">{{ st }}</span></td></tr>{% endfor %}</table></div>
{% endblock %}
